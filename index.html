<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#29343a"><title>個人地圖管理工具</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="src/styles.css?v=G01-R27">
</head>
<body>
  <header class="topbar"><div><p class="eyebrow">PERSONAL MAP</p><h1>個人地圖管理工具</h1></div><button id="authButton" class="button button-primary">初始化我的地圖</button></header>
  <main class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="地點管理">
      <div class="sidebar-head"><div><p class="eyebrow">MY PLACES</p><h2>我的地點</h2></div><button id="closeSidebar" class="icon-button" aria-label="關閉地點清單">×</button></div>
      <label class="search"><span>搜尋地點</span><input id="searchInput" type="search" placeholder="輸入地名、地址或景點"></label>
      <div class="toolbar"><button id="searchButton" class="button button-secondary" disabled>搜尋地點</button><button id="addButton" class="button button-primary" disabled>＋ 新增地點</button><button id="fitButton" class="button button-quiet" disabled>顯示全部</button></div>
      <div id="searchResults" class="search-results" aria-live="polite"></div>
      <p id="listMeta" class="muted">尚未初始化</p><div id="locationList" class="location-list"></div>
    </aside>
    <section class="map-stage"><div id="map" aria-label="地圖"></div><button id="openSidebar" class="floating-control open-sidebar">☰ <span>地點清單</span></button><button id="quickAddButton" class="floating-control quick-add" disabled>＋ 新增地點</button><aside id="placePanel" class="place-panel" aria-live="polite" hidden><div class="place-panel-head"><div><p class="eyebrow">PLACE DETAILS</p><h2 id="placePanelTitle">地點資訊</h2></div><button id="closePlacePanel" class="icon-button" aria-label="關閉地點資訊">×</button></div><p id="placePanelAddress" class="place-panel-address"></p><p class="place-panel-coordinate">座標：<strong id="placePanelCoordinate">—</strong></p><p id="placePanelMeta" class="muted"></p><div class="place-panel-actions"><button id="panelAddButton" class="button button-primary">＋ 新增地點</button><button id="panelEditButton" class="button button-secondary" hidden>編輯地點</button><button id="panelDeleteButton" class="button button-destructive" disabled>刪除地點</button></div></aside><div id="status" class="status" role="status">請先初始化你的地圖</div></section>
  </main>
  <dialog id="locationDialog"><form method="dialog" id="locationForm"><div class="dialog-head"><div><p class="eyebrow">LOCATION</p><h2 id="dialogTitle">新增地點</h2></div><button value="cancel" class="icon-button" aria-label="關閉">×</button></div><p id="dialogHint" class="muted">輸入地址即可定位，也可以貼上「緯度,經度」座標。</p><input type="hidden" id="locationId"><div class="form-grid"><label>名稱＊<input id="name" required></label><label>分類<input id="category"></label><label class="span-2">地址<input id="address" autocomplete="street-address"></label><label class="span-2">座標（緯度,經度）<input id="coordinate" inputmode="decimal" placeholder="例如 25.033964,121.564468" autocomplete="off"></label><label>緯度<input id="latitude" inputmode="decimal"></label><label>經度<input id="longitude" inputmode="decimal"></label><label class="span-2">說明<textarea id="description" rows="4"></textarea></label></div><p id="formError" class="form-error" aria-live="polite"></p><div class="dialog-actions"><button value="cancel" class="button button-quiet">取消</button><button id="saveButton" value="default" class="button button-primary">儲存地點</button></div></form></dialog>
  <script>window.__PERSONAL_MAP_CONFIG__={oauthClientId:"948538945626-fbr7tt6t1loepoi85bqru5o9pqu23qco.apps.googleusercontent.com"};</script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="src/app.js?v=G01-R27"></script><script type="module" src="src/recovery-ui.js?v=G01-R27"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</body></html>
